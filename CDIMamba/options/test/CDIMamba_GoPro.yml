# CDIMamba -- evaluation on the four benchmarks of Table 1.
#
#   GoPro 34.89/0.9760 | HIDE 32.67/0.9599 | RealBlur-R 41.67/0.9871 | RealBlur-J 34.49/0.9514
#
# Usage:
#   python basicsr/test.py -opt options/test/CDIMamba_GoPro.yml

name: CDIMamba_GoPro_Test
model_type: CDIMambaModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  test:
    name: GoPro
    type: PairedDeblurDataset
    io_backend:
      type: disk
    dataroot_gt: datasets/GoPro/test/sharp
    dataroot_lq: datasets/GoPro/test/blur
    gt_size: ~
    phase: test
    # RealBlur-R: set dataroot_lq to datasets/RealBlur_R/test/blur
    # RealBlur-J: set dataroot_lq to datasets/RealBlur_J/test/blur
    # HIDE      : set dataroot_* to datasets/HIDE/test/*

network_g:
  type: CDIMamba
  dim: 48
  num_blocks: [4, 6, 6]
  num_heads: [1, 2, 4]
  num_directions: 4
  num_experts: 4
  topk: 2
  d_state: 16
  use_cdimm: true
  use_cdcem: true
  weight_sharing: true
  with_dlb: true

path:
  pretrain_network_g: experiments/CDIMamba_GoPro/models/net_g_latest.pth
  strict_load_g: true
  param_key_g: params

val:
  save_img: true
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

dist_params:
  backend: nccl
  port: 29500
